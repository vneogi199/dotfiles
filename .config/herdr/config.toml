onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+s"
rename_tab = "prefix+,"
split_vertical = "prefix+|"

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = "%a %d %b %I:%M %p" },
]
tab_bar_right_separator = "  "
